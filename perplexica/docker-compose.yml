services:
  vane:
    image: itzcrazykns1337/vane:latest
    container_name: ${VANE_NAME:-vane}

    ports:
      # Container listens on 3000 internally; only the host port is overridable.
      - "${VANE_PORT:-3001}:3000"

    volumes:
      # Connections, model selections, chat history, and search settings.
      - "${VANE_DATA:-vane-data}:/home/vane/data"

    extra_hosts:
      # The connection points at host.docker.internal, not localhost. Docker
      # Desktop supplies that name; host-gateway is the Linux equivalent,
      # declared here so this file works unchanged on either platform.
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

volumes:
  vane-data:
    name: ${VANE_VOLUME:-vane-data}
