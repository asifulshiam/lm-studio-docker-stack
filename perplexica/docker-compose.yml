services:
  vane:
    image: itzcrazykns1337/vane:latest
    container_name: ${VANE_NAME:-vane}

    ports:
      # Container listens on 3000 internally; only the host port is overridable.
      - "${VANE_PORT:-3001}:3000"

    volumes:
      # Connections, model selections, chat history, and search settings.
      - "${VANE_DATA:-vane-data}:/home/vane/data"

    extra_hosts:
      # Required for the model connection to reach the host.
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

volumes:
  vane-data:
    name: ${VANE_VOLUME:-vane-data}
